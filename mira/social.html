<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mira's World Around Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Whole Social book "The World Around Me" (Horizon, Grade 1) – 5 units → unit tabs → islands → one big activity card per round. */
:root{
  --bg:#f3f0ff; --bg2:#e4ddff; --card:#ffffff; --ink:#2a2338; --muted:#7c7390;
  --coral:#ff7a59; --sun:#ffc93c; --leaf:#4cbb5c; --sky:#3fb0ff; --grape:#9b6cff; --night:#5b4bc4;
  --ok:#3fb950; --bad:#e5484d; --shadow:0 6px 0 rgba(42,35,56,.12);
  --display:'Fredoka','Baloo 2','Comic Sans MS','Segoe UI Rounded',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;
  background-image:radial-gradient(circle at 8% 8%,#fff6c4 0,transparent 32%),radial-gradient(circle at 92% 92%,#cfeeff 0,transparent 40%);}
button{font-family:inherit;font-weight:800;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
#app{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:10px 40px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.5rem;font-weight:700;color:var(--night)}
.brand span.m{font-size:2rem;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);font-size:.95rem;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--sun)}
.starbank{background:var(--sun);border-radius:999px;padding:8px 14px;font-family:var(--display);font-size:1.1rem;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:28px;padding:18px 22px;box-shadow:var(--shadow);margin-bottom:14px}
.hero h1{font-size:clamp(1.4rem,4vw,2rem)}
.hero p{margin:6px 0 0;color:var(--muted);font-size:1rem}
.hero .big{font-size:3.2rem;line-height:1}
.hero .ar{display:block;font-size:.95rem;color:var(--grape);margin-top:4px;direction:rtl;text-align:right}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero .big{display:none}}
.units{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.unit{flex:1 1 140px;background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);text-align:left;border-bottom:6px solid var(--c);display:flex;align-items:center;gap:8px;transition:transform .12s}
.unit .e{font-size:1.7rem}
.unit .t{font-family:var(--display);font-size:1rem;line-height:1.15}
.unit .u{font-size:.75rem;color:var(--muted)}
.unit.on{background:var(--c);color:#fff;transform:translateY(-2px)}
.unit.on .u{color:rgba(255,255,255,.85)}
.sectionTitle{font-size:1rem;color:var(--muted);margin:14px 4px 8px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.island{background:var(--card);border-radius:22px;padding:14px 12px 12px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .12s;border-top:8px solid var(--c,var(--coral))}
.island:hover{transform:translateY(-3px)}
.island .em{font-size:2.3rem;line-height:1}
.island .t{font-family:var(--display);font-size:1.05rem;font-weight:700}
.island .s{font-size:.82rem;color:var(--muted)}
.island .stars{font-size:1rem;letter-spacing:1px;color:var(--sun)}
.island .stars .off{color:#e4ddff}
.island.test{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:linear-gradient(90deg,#fff6c4,#e4ddff)}
.island.test .em{font-size:3rem}
.island.test.book{background:linear-gradient(90deg,#ffe1d6,#fff6c4)}
.panel{background:var(--card);border-radius:28px;padding:18px;box-shadow:var(--shadow)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.back{background:var(--bg2);border-radius:999px;padding:10px 16px;font-size:1rem}
.progress{flex:1;min-width:120px;height:14px;background:var(--bg2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--grape),var(--sun));width:0;transition:width .4s}
.instr{display:flex;align-items:flex-start;gap:10px;background:var(--bg2);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.instr .txt{flex:1;min-width:0}
.instr h2{font-size:1.25rem}
.instr .ar{direction:rtl;text-align:right;color:var(--grape);font-size:1rem;margin-top:4px;display:none}
body.ar .instr .ar{display:block}
.ar-hint{display:none;direction:rtl}
body.ar .ar-hint{display:block}
.speak{background:var(--sky);color:#fff;border-radius:999px;width:46px;height:46px;font-size:1.3rem;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.speak:active{transform:translateY(2px);box-shadow:none}
.speak.turtle{background:var(--leaf)}
.q{font-family:var(--display);font-size:clamp(1.25rem,4vw,1.7rem);text-align:center;margin:6px 0 4px;line-height:1.35}
.q .blank{display:inline-block;min-width:3em;border-bottom:4px solid var(--grape);color:var(--grape);padding:0 6px}
.qar{direction:rtl;text-align:center;color:var(--grape);font-size:1.1rem;margin-bottom:8px;display:none}
body.ar .qar{display:block}
.scene{font-size:clamp(2.6rem,9vw,4rem);text-align:center;line-height:1.2;margin:8px 0;letter-spacing:.08em}
.scene.small{font-size:clamp(1.8rem,6vw,2.6rem)}
.arrow{color:var(--muted);font-size:.6em;vertical-align:middle}
.tile{background:var(--card);border:3px solid var(--bg2);border-radius:18px;padding:12px 16px;font-size:1.25rem;font-family:var(--display);font-weight:600;box-shadow:var(--shadow);transition:transform .1s;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:120px}
.tile .e{font-size:2.4rem;line-height:1}
.tile .e:empty{display:none}
.tile .w{font-size:1.1rem;text-align:center}
.tile .wa{font-size:.9rem;color:var(--grape);direction:rtl;display:none}
body.ar .tile .wa{display:block}
.tile:hover{transform:translateY(-2px)}
.tile.sel{border-color:var(--sky);background:#e8f4ff}
.tile.ok{border-color:var(--ok);background:#e6f8ea;color:#1f7a2f}
.tile.bad{animation:shake .4s;border-color:var(--bad);background:#ffecec}
.tile.used{opacity:.35;pointer-events:none;transform:none}
.tile.word{min-width:0;padding:10px 16px;font-size:1.35rem;min-height:54px}
.tile.tfb{min-width:140px;font-size:1.4rem}
.tile.tfb.t{border-color:#bfe8c8}.tile.tfb.f{border-color:#f5c6c6}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.cols .col{display:flex;flex-direction:column;gap:12px}
.cols .tile{min-width:0}
.feedback{text-align:center;font-family:var(--display);font-size:1.4rem;min-height:2.2rem;margin:10px 0;color:var(--leaf)}
.feedback.bad{color:var(--bad)}
.nextbtn{display:block;margin:12px auto 0;background:var(--coral);color:#fff;border-radius:999px;padding:14px 30px;font-family:var(--display);font-size:1.3rem;box-shadow:0 5px 0 #c9553a}
.nextbtn:active{transform:translateY(3px);box-shadow:none}
.nextbtn.ghost{background:var(--bg2);color:var(--ink);box-shadow:var(--shadow);font-size:1rem;padding:10px 18px}
.buckets{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;margin-top:14px}
.bucket{background:var(--bg2);border-radius:20px;padding:12px 8px;text-align:center;min-height:120px;border:3px dashed transparent}
.bucket:hover{border-color:var(--sky)}
.bucket.bad{animation:shake .4s;border-color:var(--bad)}
.bucket .h{font-family:var(--display);font-size:1.1rem}
.bucket .e{font-size:2rem}
.bucket .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.bucket .got span{background:var(--card);border-radius:999px;padding:2px 8px;font-size:1rem}
.counter{text-align:center;color:var(--muted);font-size:.9rem;margin-top:8px}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:14px 0}
.slot{width:78px;height:78px;border-radius:18px;background:var(--bg2);border-bottom:5px solid #c9bdfb;display:grid;place-items:center;font-size:2.2rem;position:relative}
.slot.fill{background:#e6f8ea;border-bottom-color:var(--ok);animation:pop .3s}
.slot .n{position:absolute;top:-10px;left:-6px;background:var(--grape);color:#fff;font-size:.8rem;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display)}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.sentence{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:64px;background:var(--bg2);border-radius:18px;padding:12px;margin:12px 0;font-family:var(--display);font-size:1.5rem}
.sentence .wslot{min-width:70px;height:46px;border-bottom:4px dashed #c9bdfb;border-radius:6px}
.sentence .wdone{background:#e6f8ea;color:#1f7a2f;border-radius:12px;padding:4px 12px;animation:pop .3s}
.story{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.step{background:var(--bg2);border-radius:18px;padding:12px 10px;text-align:center;cursor:pointer;transition:transform .1s;border:3px solid transparent}
.step:active{transform:scale(.97)}
.step.lit{border-color:var(--sun);background:#fff6c4}
.step .e{font-size:2.6rem;line-height:1}
.step .k{font-family:var(--display);color:var(--night);font-size:1.1rem;margin-top:4px}
.step .s{font-size:.9rem;color:var(--muted)}
.step .a{font-size:.85rem;color:var(--grape);direction:rtl;display:none}
body.ar .step .a{display:block}
.text{background:#fff6c4;border-radius:18px;padding:14px 16px;font-size:1.15rem;line-height:1.6;margin:10px 0}
.text b{color:var(--night)}
.text .ar{direction:rtl;color:var(--grape);display:none;margin-top:8px;font-size:1.05rem}
body.ar .text .ar{display:block}
.stmt{font-family:var(--display);font-size:clamp(1.3rem,4vw,1.8rem);text-align:center;background:var(--bg2);border-radius:18px;padding:16px;margin:10px 0}
.stmt .ar{direction:rtl;color:var(--grape);font-size:1.1rem;display:none;margin-top:6px}
body.ar .stmt .ar{display:block}
.fact{background:#fff6c4;border-radius:16px;padding:10px 14px;margin-top:10px;font-size:1rem;text-align:center}
.fact .ar{direction:rtl;color:var(--grape);display:none;margin-top:4px}
body.ar .fact .ar{display:block}
.result{text-align:center;padding:10px}
.result .bigstars{font-size:3.6rem;letter-spacing:6px;margin:10px 0}
.result .bigstars .off{color:#e4ddff}
.result h2{font-size:1.8rem}
.result p{color:var(--muted)}
.report{display:grid;gap:10px}
.report .card{background:var(--bg2);border-radius:18px;padding:12px 14px}
.report .card h3{font-size:1.05rem;margin-bottom:6px}
.report ul{margin:4px 0 0;padding-left:18px;font-size:.95rem}
.report li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:6px 8px;text-align:left;border-bottom:1px solid #d6cdf5}
th{color:var(--muted);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
#mascot{position:fixed;right:14px;bottom:14px;font-size:3rem;line-height:1;transition:transform .2s;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}
#mascot.happy{animation:jump .6s}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-26px) rotate(-10deg)}60%{transform:translateY(-10px) rotate(8deg)}}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;font-size:.95rem;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#confetti{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>

</div>

  const body=$('#body'); $('#prog').style.width='100%';
  const msg=stars===3?'Perfect! A wise little owl!':stars===2?'Great work! One more go for 3 stars?':'Good try! Let’s play it again together.';
  const msgAr=stars===3?'ممتاز! بومة صغيرة حكيمة!':stars===2?'عمل رائع! مرة أخرى لثلاث نجوم؟':'محاولة جيدة! لنلعبها مرة أخرى معاً.';
  body.innerHTML=`<div class="result"><div class="bigstars">${starsHtml(stars)}</div><h2>${msg}</h2><div class="ar-hint" style="color:var(--grape);font-size:1.1rem">${msgAr}</div><p>${total} questions · ${mistakes} slip${mistakes===1?'':'s'}</p><div class="row"><button class="nextbtn" id="again">Play again 🔁</button><button class="nextbtn ghost" id="toHome">Back to islands 🗺️</button></div></div>`;
  $('#again').onclick=()=>startLevel(level.id); $('#toHome').onclick=home; speak(`${msg} You got ${stars} star${stars===1?'':'s'}!`);
}

// ===================== ROUND TYPES =====================
const ROUNDS={};
function header(body,r){ body.appendChild(el('div','q',r.q)); body.appendChild(el('div','qar',r.ar||'')); if(r.scene) body.appendChild(el('div','scene'+(r.small?' small':''),r.scene)); }

ROUNDS.story=function(r,body,done){
  header(body,r);
  if(r.text){ body.appendChild(el('div','text',`${r.text}<div class="ar">${r.textAr||''}</div>`)); const b1=el('button','nextbtn ghost','🔊 Read the story to me'); b1.onclick=()=>speak(plain(r.text),{force:true}); const b2=el('button','nextbtn ghost','🐢 Read it slowly'); b2.onclick=()=>speak(plain(r.text),{force:true,slow:true}); const row=el('div','row'); row.append(b1,b2); body.appendChild(row); speak('Story time! '+plain(r.text)); }
  if(r.steps){ const strip=el('div','story'); body.appendChild(strip); const seen=new Set(); const counter=el('div','counter','Tap a picture to hear it. Listened to 0 of '+r.steps.length);
    r.steps.forEach((s,i)=>{ const d=el('button','step',`<div class="e">${s[0]}</div><div class="k">${i+1}. ${s[1]}</div><div class="s">${s[2]}</div><div class="a">${s[3]}</div>`); d.onclick=()=>{ sfx.tap(); strip.querySelectorAll('.step').forEach(x=>x.classList.remove('lit')); d.classList.add('lit'); speak(`${s[1]}, ${s[2]}`,{force:true}); seen.add(i); counter.textContent=seen.size<r.steps.length?`Listened to ${seen.size} of ${r.steps.length}`:'You heard the whole story! 🌟'; }; strip.appendChild(d); });
    body.appendChild(counter); const all=el('button','nextbtn ghost','🔊 Read the whole story'); all.onclick=()=>{ speak(r.steps.map(s=>`${s[1]}, ${s[2]}`).join(' '),{force:true}); strip.querySelectorAll('.step').forEach(x=>x.classList.add('lit')); r.steps.forEach((s,i)=>seen.add(i)); counter.textContent='You heard the whole story! 🌟'; }; body.appendChild(all); speak((r.intro||'')+' Tap each picture to listen.'); }
  const b=el('button','nextbtn','Next ➜'); b.onclick=done; body.appendChild(b);
};
const opts=r=>typeof r.opts==='function'?r.opts():r.opts;
ROUNDS.pick=function(r,body,done){
  header(body,r); const row=el('div','row'); const fb=el('div','feedback',''); body.append(row,fb); let locked=false;
  shuffle(opts(r)).forEach(([e,w,ok])=>{ const b=el('button','tile',tileHtml(e,w)); b.onclick=()=>{ if(locked)return; sfx.tap();
    if(ok){ locked=true; right(); b.classList.add('ok'); fb.textContent=praise(); fb.classList.remove('bad'); row.querySelectorAll('.tile').forEach(t=>{ if(t!==b) t.classList.add('used'); });
      const full=r.q.includes('class="blank"')?plain(r.q).replace('___',w.trim()):(r.any?`I’m Mira, I love ${w==='Sports'?'sports':'to '+w.toLowerCase()}!`:w);
      nextBtn(body,done,r,`${praise()} ${full}`); }
    else { wrong(); b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),450); fb.textContent=retry(); fb.classList.add('bad'); speak(`${w}? ${retry()}`); } }; row.appendChild(b); });
  if(r.listen){ const lb=el('button','nextbtn ghost','🔊 Hear the words'); lb.onclick=()=>{ let t=''; row.querySelectorAll('.tile .w').forEach(x=>t+=x.textContent+'. '); speak(t,{force:true,slow:true,pitch:1}); }; body.appendChild(lb); }
};
ROUNDS.multi=function(r,body,done){
  header(body,r); const row=el('div','row'); const fb=el('div','feedback',''); body.append(row,fb); const need=r.opts.filter(o=>o[2]).length; let got=0,locked=false; const counter=el('div','counter',`Found 0 of ${need}`); body.appendChild(counter);
  shuffle(r.opts).forEach(([e,w,ok])=>{ const b=el('button','tile',tileHtml(e,w)); b.onclick=()=>{ if(locked||b.classList.contains('ok'))return; sfx.tap();
    if(ok){ right(); b.classList.add('ok'); got++; counter.textContent=`Found ${got} of ${need}`; fb.textContent=praise(); fb.classList.remove('bad'); if(got===need){ locked=true; row.querySelectorAll('.tile:not(.ok)').forEach(t=>t.classList.add('used')); nextBtn(body,done,r); } else speak(`${w}! Yes. Find more.`); }
    else { wrong(); b.classList.add('bad'); setTimeout(()=>{b.classList.remove('bad'); b.classList.add('used');},450); fb.textContent=retry(); fb.classList.add('bad'); speak(`${w}? No. ${retry()}`); } }; row.appendChild(b); });
};
ROUNDS.tf=function(r,body,done){
  header(body,r); const items=r.items; let i=0; const card=el('div'); body.appendChild(card); const row=el('div','row'); body.appendChild(row); const counter=el('div','counter',''); body.appendChild(counter);
  const T=el('button','tile tfb t',tileHtml('✅','True')), F=el('button','tile tfb f',tileHtml('❌','False')); row.append(T,F);
  const show=()=>{ const it=items[i]; if(!it){ row.remove(); nextBtn(body,done,r); return; } card.innerHTML=`<div class="stmt">${it[0]}<div class="ar">${it[2]||''}</div></div><div class="feedback"></div>`; counter.textContent=`${i+1} of ${items.length}`; speak(`${it[0]} True or false?`); };
  const choose=v=>{ const it=items[i]; if(!it)return; const fb=card.querySelector('.feedback'); sfx.tap();
    if(v===!!it[1]){ right(); fb.textContent=praise(); fb.classList.remove('bad'); speak(`${v?'True':'False'}! ${praise()}`); i++; setTimeout(show,900); }
    else { wrong(); (v?T:F).classList.add('bad'); setTimeout(()=>(v?T:F).classList.remove('bad'),450); fb.textContent=retry(); fb.classList.add('bad'); speak(`Hmm. ${it[0]} Think again!`); } };
  T.onclick=()=>choose(true); F.onclick=()=>choose(false); show();
};
ROUNDS.sort=function(r,body,done){
  header(body,r); const items=shuffle(r.items); let i=0; const card=el('div'); body.appendChild(card); const bk=el('div','buckets'); bk.style.setProperty('--n',r.buckets.length); body.appendChild(bk); const bEls={};
  r.buckets.forEach(b=>{ const d=el('button','bucket',`<div class="e">${b.e}</div><div class="h">${b.n}</div><div class="ar-hint" style="color:var(--grape);font-size:.9rem">${b.ar}</div><div class="got"></div>`); d.onclick=()=>choose(b.v); bk.appendChild(d); bEls[b.v]=d; });
  const counter=el('div','counter',''); body.appendChild(counter);
  const show=()=>{ const it=items[i]; if(!it){ nextBtn(body,done,r); return; } card.innerHTML=`<div class="scene">${it[0]}</div><div class="q" style="font-size:1.4rem">${it[1]} <span class="ar-hint" style="display:inline;color:var(--grape)">${arWord(it[1])}</span></div><div class="feedback"></div>`; counter.textContent=`${i+1} of ${items.length}`; speak(`${it[1]}. ${r.buckets.map(b=>b.n).join(' or ')}?`); };
  const choose=v=>{ const it=items[i]; if(!it)return; const fb=card.querySelector('.feedback'); const bn=r.buckets.find(b=>b.v===v).n;
    if(v===it[2]){ right(); bEls[v].querySelector('.got').appendChild(el('span',null,it[0])); fb.textContent=praise(); fb.classList.remove('bad'); speak(`Yes! ${it[1]}: ${bn}.`); i++; setTimeout(show,900); }
    else { wrong(); bEls[v].classList.add('bad'); setTimeout(()=>bEls[v].classList.remove('bad'),450); fb.textContent=retry(); fb.classList.add('bad'); speak(`${it[1]}, ${bn}? ${retry()}`); } };
  show();
};
ROUNDS.order=function(r,body,done){
  header(body,r); const slots=el('div','slots'); body.appendChild(slots);
  r.items.forEach((it,k)=>{ slots.appendChild(el('div','slot',`<span class="n">${k+1}</span>`)); if(k<r.items.length-1) slots.appendChild(el('span','arrow','➜')); });
  const row=el('div','row'); const fb=el('div','feedback',''); body.append(row,fb); let k=0;
  shuffle(r.items.map((it,idx)=>[it,idx])).forEach(([it,idx])=>{ const b=el('button','tile',tileHtml(it[0],it[1])); b.onclick=()=>{ sfx.tap();
    if(idx===k){ right(); b.classList.add('used'); const s=slots.querySelectorAll('.slot')[k]; s.innerHTML=`<span class="n">${k+1}</span>${it[0]}`; s.classList.add('fill'); k++; fb.textContent=praise(); fb.classList.remove('bad'); if(k===r.items.length) nextBtn(body,done,r); else speak(`${r.seq?SEQ[k-1]+', ':''}${it[1].toLowerCase()}. What comes next?`); }
    else { wrong(); b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),450); fb.textContent=retry(); fb.classList.add('bad'); speak(`Not yet. What comes ${k===0?'first':'next'}?`); } }; row.appendChild(b); });
  speak(plain(r.q)+' Tap what comes first.');
};
ROUNDS.unscramble=function(r,body,done){
  header(body,r); const sent=el('div','sentence'); body.appendChild(sent); r.words.forEach(()=>sent.appendChild(el('span','wslot',''))); const row=el('div','row'); const fb=el('div','feedback',''); body.append(row,fb); const target=r.words.join(' '); let k=0;
  shuffle(r.words.map((w,idx)=>[w,idx])).forEach(([w,idx])=>{ const b=el('button','tile word',`<span class="w">${w}</span>`); b.onclick=()=>{ sfx.tap();
    if(idx===k){ right(); b.classList.add('used'); const s=sent.querySelectorAll('.wslot,.wdone')[k]; s.className='wdone'; s.textContent=w; k++; fb.textContent=praise(); fb.classList.remove('bad'); if(k===r.words.length) nextBtn(body,done,r,`${praise()} ${target}`); else speak(r.words.slice(0,k).join(' ')+'…'); }
    else { wrong(); b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),450); fb.textContent=retry(); fb.classList.add('bad'); speak(k===0?'Which word comes first? Look for the capital letter!':`${r.words.slice(0,k).join(' ')}… what comes next?`); } }; row.appendChild(b); });
  const hear=el('button','nextbtn ghost','🔊 Hear the sentence'); hear.onclick=()=>speak(target,{force:true,slow:true}); body.appendChild(hear);
};
ROUNDS.match=function(r,body,done){
  header(body,r); const cols=el('div','cols'); const L=el('div','col'),R=el('div','col'); cols.append(L,R); body.appendChild(cols); const fb=el('div','feedback',''); body.appendChild(fb); let sel=null,left=r.pairs.length; const line=p=>(r.lines&&r.lines[p[1]])||p[1];
  shuffle(r.pairs.map((p,k)=>[p,k])).forEach(([p,k])=>{ const b=el('button','tile',tileHtml(p[0],p[1])); b.dataset.k=k; b.onclick=()=>{ if(b.classList.contains('ok'))return; sfx.tap(); L.querySelectorAll('.tile').forEach(t=>t.classList.remove('sel')); b.classList.add('sel'); sel=b; speak(line(p),{force:true}); }; L.appendChild(b); });
  shuffle(r.pairs.map((p,k)=>[p,k])).forEach(([p,k])=>{ const b=el('button','tile',tileHtml(p[2],p[3])); b.onclick=()=>{ sfx.tap(); if(!sel){ fb.textContent='Tap the left side first!'; fb.classList.add('bad'); speak('Tap the left side first!'); return; } const sk=Number(sel.dataset.k);
      if(sk===k){ right(); sel.classList.remove('sel'); sel.classList.add('ok'); b.classList.add('ok'); sel.style.pointerEvents='none'; b.style.pointerEvents='none'; fb.textContent=praise(); fb.classList.remove('bad'); speak(`Yes! ${line(p)} ${p[3]}.`); sel=null; left--; if(left===0) nextBtn(body,done,r); }
      else { wrong(); b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),450); fb.textContent=retry(); fb.classList.add('bad'); speak(`No. ${line(r.pairs[sk])} ${retry()}`); } }; R.appendChild(b); });
  speak(plain(r.q)+' Tap one on the left, then its match on the right.');
};
ROUNDS.sound=function(r,body,done){
  header(body,r); body.appendChild(el('div','fact',`👄 ${r.tip}<div class="ar">${r.tipAr}</div>`)); const row=el('div','row'); body.appendChild(row);
  r.words.forEach(([e,w])=>{ const b=el('button','tile',tileHtml(e,w)); b.onclick=()=>{ sfx.tap(); b.classList.add('sel'); setTimeout(()=>b.classList.remove('sel'),600); speak(w,{force:true,slow:true,pitch:1}); }; row.appendChild(b); });
  const all=el('button','nextbtn ghost',`🐢 Say them slowly: ${r.sound.toUpperCase()}`); all.onclick=()=>speak(r.words.map(w=>w[1]).join('. '),{force:true,slow:true,pitch:1}); body.appendChild(all);
  body.appendChild(el('div','counter','Tap a word, listen, then say it out loud 3 times! 🎤')); const b=el('button','nextbtn','Next ➜'); b.onclick=done; body.appendChild(b); speak(plain(r.q)+' '+r.tip,{pitch:1});
};

function report(){
  speechSynthesis&&speechSynthesis.cancel(); const v=$('#view'); v.innerHTML=''; const panel=el('div','panel'); v.appendChild(panel);
  const hardList=Object.entries(hard).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const tables=UNITS.map(u=>{ const rows=u.levels.map(l=>{ const p=progress[l.id]||{}; return `<tr><td>${l.emoji} ${l.title}</td><td>${l.pages}</td><td>${starsHtml(p.stars||0)}</td><td>${p.plays||0}</td></tr>`; }).join(''); const bt=progress['test_'+u.id]||{}; return `<div class="card"><h3>Unit ${u.n}: ${u.title} (${u.pages})</h3><table><tr><th>Island</th><th>Book</th><th>Best</th><th>Plays</th></tr>${rows}<tr><td>🏆 Big Test</td><td>all</td><td>${starsHtml(bt.stars||0)}</td><td>${bt.plays||0}</td></tr></table><h3 style="margin-top:8px">Answer key</h3><ul>${KEYS[u.id].map(k=>`<li>${k}</li>`).join('')}</ul></div>`; }).join('');
  const bb=progress['test_book']||{};
  panel.innerHTML=`<div class="topbar"><button class="back" id="backBtn">⬅ Islands</button><h2>For Mum & Dad 👨‍👩‍👧</h2></div><div class="report">
    <div class="card"><h3>Questions Mira slipped on (practise these)</h3>${hardList.length?'<ul>'+hardList.map(([q,n])=>`<li>${q} <b>×${n}</b></li>`).join('')+'</ul>':'<p>No slips yet – play some islands first.</p>'}<p style="margin:6px 0 0">👑 Whole Book Challenge: ${starsHtml(bb.stars||0)} · ${bb.plays||0} plays</p></div>
    ${tables}
    <div class="card"><h3>5-minute chats (say it together)</h3><ul><li>Count on fingers: <i>First · Next · After that · Then · Later · Finally</i> – then tell your morning and evening.</li><li>"What can your body do?" → 5 senses on 5 fingers. "Is a robot… no wait, is the sun blue?"</li><li>"Point north! Where is east?" – play compass in the living room.</li><li>"Red means…? Yellow…? Green…?" and "Before we cross the street we…?" (stop, look, listen).</li><li>"Home, neighborhood, city, country, continent" – say them from smallest to biggest.</li></ul></div></div>`;
  $('#backBtn').onclick=home;
}
